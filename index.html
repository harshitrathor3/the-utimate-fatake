<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Cracker Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head><body>
<header>
  <b id="logo" onclick="location.hash='';scrollTo(0,0)">Crackers</b>
  <input id="q" type="search" placeholder="Search all crackers..." aria-label="Search products">
</header>
<div id="app"><p class="empty">Loading...</p></div>
<button id="fab" class="mt" onclick="dr(1)" aria-label="Open cart">
  <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg><span class="bg" id="cc">0</span></span>
  <span class="tx"><small>Your cart</small><span id="ct">&#8377;0</span></span>
</button>
<div id="ov" onclick="dr(0)"></div>
<aside id="dr" aria-label="Cart">
  <div class="dh">Your order <button onclick="dr(0)" aria-label="Close">&times;</button></div>
  <div class="db" id="db"></div>
  <div class="df" id="df"></div>
</aside>
<script src="app.js"></script>
</body></html>
